# Development broker for Edgewise. Not for production, not a service.
#
#   mosquitto -v -c tools/mosquitto-dev.conf
#
# Run it in the foreground from the repo root so it is obvious when it is up,
# and so stopping it is Ctrl-C rather than a service manager. `-v` prints every
# packet, which is most of the debugging you will need.

listener 1883 0.0.0.0

# The badge has to reach this over the LAN, so it listens on all interfaces.
# That also means Windows Firewall has to allow it -- the single most common
# reason a badge "cannot connect" for no visible reason:
#
#   New-NetFirewallRule -DisplayName "mosquitto dev 1883" -Direction Inbound `
#     -LocalPort 1883 -Protocol TCP -Action Allow -Profile Private
allow_anonymous true

# Not optional. The crash-recovery story in the protocol *is* retained-message
# survival: the badge holds no state that matters and rebuilds the whole board
# from retained messages on reconnect. A broker that forgets them on restart
# makes that test silently vacuous -- it would pass while proving nothing.
persistence true
persistence_location ./.mosquitto/

# A retained rebuild can arrive as a burst of a dozen messages, and the chaos
# publisher deliberately sends thousands. Do not let the broker be the thing
# that drops them; the badge's own limits are what we are trying to measure.
max_queued_messages 10000
